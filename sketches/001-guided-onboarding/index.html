<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Northstar University — Guided Entry</title><style>
*{box-sizing:border-box}body{margin:0;background:#fbfaf7;color:#24302e;font:15px/1.5 Inter,system-ui,sans-serif}.page{min-height:100vh;max-width:1120px;margin:auto;padding:25px 35px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;display:flex;gap:10px;align-items:center}.logo{width:34px;height:34px;border-radius:50%;background:#d98962;color:#fff;display:grid;place-items:center}.support{color:#667570;font-size:12px}.content{min-height:calc(100vh - 84px);display:grid;place-items:center}.onboard{width:min(100%,760px)}.kicker{color:#c56842;font-weight:800;font-size:12px;letter-spacing:.13em;text-transform:uppercase}.onboard h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(39px,6vw,69px);line-height:.99;letter-spacing:-.06em;max-width:660px;margin:13px 0 17px}.intro{color:#677772;font-size:17px;max-width:540px}.steps{display:flex;gap:8px;margin:38px 0 27px}.step{height:4px;width:74px;background:#e6e0d8;border-radius:9px}.step.active{background:#d98962}.question{background:#fff;border:1px solid #ece7df;border-radius:17px;padding:25px;box-shadow:0 14px 40px #735f4410}.question h2{font-size:18px;margin:0 0 17px}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.choice{border:1px solid #e5e0d8;background:#fffaf5;border-radius:12px;text-align:left;padding:15px 12px;min-height:84px;color:#34403d}.choice span{display:block;font-size:22px;margin-bottom:7px}.choice strong{display:block;font-size:13px}.choice small{display:block;color:#86918d;font-size:11px;margin-top:3px}.choice.selected{border-color:#d98962;background:#fff1e9;box-shadow:0 0 0 3px #d989621c}.next{margin-top:20px;border:0;background:#303e3a;color:white;border-radius:10px;padding:12px 19px;font-weight:750}.back{margin-left:10px;border:0;background:transparent;color:#71807a}.result{display:none;margin-top:15px;padding:13px;background:#f0f5f1;border-radius:10px;color:#486258;font-size:13px}.result.show{display:block}@media(max-width:650px){.page{padding:20px}.support{display:none}.content{min-height:calc(100vh - 70px)}.choices{grid-template-columns:repeat(2,1fr)}.question{padding:18px}.onboard h1{font-size:45px}}
</style></head><body><div class="page"><header class="top"><div class="brand"><span class="logo">N</span> Northstar University</div><span class="support">Need help? Visit the demo guide</span></header><main class="content"><section class="onboard"><p class="kicker">Welcome to your portal</p><h1>Let’s get you to the right place.</h1><p class="intro">Tell us how you participate in university life, and we’ll open a workspace with the tools you need.</p><div class="steps"><i class="step active"></i><i class="step"></i><i class="step"></i></div><div class="question"><h2>Which best describes you?</h2><div class="choices"><button class="choice selected" data-role="Student"><span>◎</span><strong>Student</strong><small>Learn & progress</small></button><button class="choice" data-role="Faculty"><span>✦</span><strong>Faculty</strong><small>Teach & support</small></button><button class="choice" data-role="Staff"><span>⌂</span><strong>Department staff</strong><small>Coordinate & serve</small></button><button class="choice" data-role="Admin"><span>◇</span><strong>University admin</strong><small>Lead & oversee</small></button></div><button class="next" id="next">Continue</button><button class="back" id="back">Back</button><div class="result" id="result" role="status"></div></div></section></main></div><script>let role='Student';const result=document.querySelector('#result');document.querySelectorAll('.choice').forEach(c=>c.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));c.classList.add('selected');role=c.dataset.role});document.querySelector('#next').onclick=()=>{result.textContent='Next: choose a fictional '+role.toLowerCase()+' identity, then enter the demo portal.';result.classList.add('show')};document.querySelector('#back').onclick=()=>{result.textContent='You are already at the first step.';result.classList.add('show')};</script></body></html>
